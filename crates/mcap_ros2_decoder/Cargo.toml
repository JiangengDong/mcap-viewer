[package]
name = "mcap_ros2_decoder"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
log = "0.4.20"
mcap_decoder = { version = "0.1.0", path = "../mcap_decoder" }
once_cell = "1.18.0"
regex = "1.10.0"
thiserror = "1.0.49"

[dev-dependencies]
clap = { version = "4.4.6", features = ["derive"] }
env_logger = "0.10.0"
mcap = { path = "../mcap" }
memmap = "0.7.0"
rayon = "1.8.0"
mcap_decoder = { version = "0.1.0", path = "../mcap_decoder", features = [
    "test-utils",
] }
mcap_viewer_storage = { path = "../mcap_viewer_storage" }
